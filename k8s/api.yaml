# TODO owner: S4 — FastAPI gateway.
# The image is built locally (make build). For Minikube, load it first:
#   minikube image load api:dev
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: smart-healthcare
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: api:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: smart-healthcare
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
