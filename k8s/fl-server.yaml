# TODO owner: S2 — Flower FedAvg server.
# The image is built locally (make build). For Minikube, load it first:
#   minikube image load fl-server:dev
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower-server
  namespace: smart-healthcare
  labels:
    app: flower-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower-server
  template:
    metadata:
      labels:
        app: flower-server
    spec:
      containers:
        - name: flower-server
          image: fl-server:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: flower-server
  namespace: smart-healthcare
spec:
  selector:
    app: flower-server
  ports:
    - port: 8080
      targetPort: 8080
